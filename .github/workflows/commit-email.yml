name: Commit email

on:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: commit-email-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-email:
    name: commit-email
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      # Passed through env (never interpolated into the script) on purpose.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the email check
        run: .github/scripts/test-check-commit-emails.sh

      # Author and committer must be a GitHub noreply address
      # (^([0-9]+\+)?[A-Za-z0-9-]+(\[bot\])?@users\.noreply\.github\.com$, case-insensitive)
      # or exactly noreply@github.com / cursoragent@cursor.com. Co-authored-by: trailers
      # only warn. The rule and its allowlist live in .github/scripts/check-commit-emails.sh.
      - name: Check author and committer emails of the PR commits
        run: .github/scripts/check-commit-emails.sh "$BASE_SHA" "$HEAD_SHA"
