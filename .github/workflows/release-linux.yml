name: Release (Linux and Windows packages)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version; empty uses Directory.Build.props <Version>, otherwise it must be that version or a prerelease of it (e.g. 1.0.0-rc.1)
        required: false
        type: string
  pull_request:
    paths:
      - .github/workflows/release-linux.yml
      - packaging/**
      - licenses/**
      - LICENSE
      - THIRD_PARTY_LICENSES.md
      - assets/fonts/**
      - src/RealmPortal.App/**
      - src/RealmPortal.Core/**
      - Directory.Build.props
      - global.json
      - Directory.Packages.props
      - nuget.config
      - "**/packages.lock.json"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  APP_PROJECT: src/RealmPortal.App/RealmPortal.App.csproj
  # AppImageKit release 13 ships appimagetool under the obsolete-* asset names.
  APPIMAGETOOL_VERSION: "13"
  APPIMAGETOOL_SHA256: "df3baf5ca5facbecfc2f3fa6713c29ab9cefa8fd8c1eac5d283b79cab33e4acb"
  # minisign 0.12 for the sign-and-publish test. SHA256 of minisign-0.12-linux.tar.gz, whose minisign signature was
  # checked against the upstream key RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3.
  MINISIGN_VERSION: "0.12"
  MINISIGN_SHA256: "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73"

jobs:
  linux-packages:
    name: linux-x64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test version resolution
        run: packaging/test-resolve-version.sh

      - name: Test deb version mapping
        run: packaging/test-deb-version.sh

      - name: Test license collection
        run: packaging/test-collect-licenses.sh

      - name: Install minisign (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="minisign-${MINISIGN_VERSION}-linux.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/${archive}"
          echo "${MINISIGN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/minisign-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          install -m 755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" "$RUNNER_TEMP/minisign-bin/minisign"
          echo "$RUNNER_TEMP/minisign-bin" >> "$GITHUB_PATH"

      - name: Test sign-and-publish script
        run: |
          minisign -v
          packaging/test-sign-and-publish.sh

      - name: Resolve package version
        id: version
        # Directory.Build.props is the single source of the version; a tag that does not match it fails here.
        run: |
          set -euo pipefail
          ver="$(packaging/resolve-version.sh)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$ver" >> "$GITHUB_ENV"
          echo "Package version: $ver"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore (locked mode)
        run: |
          set -euo pipefail
          dotnet restore "$APP_PROJECT" --locked-mode -p:PublishReadyToRun=true

      - name: Publish (linux-x64, self-contained, trimmed, ReadyToRun)
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/publish"
          dotnet publish "$APP_PROJECT" \
            -c Release \
            -r linux-x64 \
            --no-restore \
            --self-contained true \
            -p:Version="$PACKAGE_VERSION" \
            -p:InformationalVersion="$PACKAGE_VERSION" \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:PublishReadyToRun=true \
            -o "$publish_dir" \
            2>&1 | tee "$RUNNER_TEMP/publish.log"
          if grep -E 'error (IL|NETSDK)' "$RUNNER_TEMP/publish.log"; then
            echo "::error::Publish reported trim errors"
            exit 1
          fi
          echo "PUBLISH_DIR=$publish_dir" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev
          archive="obsolete-appimagetool-x86_64.AppImage"
          url="https://github.com/AppImage/AppImageKit/releases/download/${APPIMAGETOOL_VERSION}/${archive}"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive" "$url"
          echo "${APPIMAGETOOL_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/$archive"
          echo "APPIMAGETOOL=$RUNNER_TEMP/$archive" >> "$GITHUB_ENV"

      - name: Build .deb and AppImage
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/packages"
          mkdir -p "$out_dir"
          packaging/linux/build-packages.sh "$PUBLISH_DIR" "$PACKAGE_VERSION" "$out_dir"
          echo "PACKAGE_DIR=$out_dir" >> "$GITHUB_ENV"

      - name: Upload Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realm-portal-linux-${{ steps.version.outputs.version }}
          path: |
            ${{ env.PACKAGE_DIR }}/*.deb
            ${{ env.PACKAGE_DIR }}/*.AppImage
            ${{ env.PACKAGE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: win-x64 self-contained artifact
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve package version
        id: version
        # Same script as the Linux job (Git Bash on the Windows runner).
        shell: bash
        run: |
          set -euo pipefail
          ver="$(packaging/resolve-version.sh)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$ver" >> "$GITHUB_ENV"
          echo "Package version: $ver"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore (locked mode)
        shell: pwsh
        run: dotnet restore $env:APP_PROJECT --locked-mode -p:PublishReadyToRun=true

      - name: Publish (win-x64, self-contained)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:RUNNER_TEMP 'publish-win-x64'
          dotnet publish $env:APP_PROJECT `
            -c Release `
            -r win-x64 `
            --no-restore `
            --self-contained true `
            -p:Version=$env:PACKAGE_VERSION `
            -p:InformationalVersion=$env:PACKAGE_VERSION `
            -p:PublishReadyToRun=true `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed' }
          "PUBLISH_DIR=$publishDir" >> $env:GITHUB_ENV

      - name: Add license and notice files (incl. bundled .NET runtime)
        shell: bash
        run: packaging/collect-licenses.sh "$PUBLISH_DIR" win-x64 "$PUBLISH_DIR"

      - name: Package Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = $env:PUBLISH_DIR
          foreach ($doc in 'LICENSE', 'THIRD_PARTY_LICENSES.md', 'licenses/dotnet-runtime/LICENSE.TXT', 'licenses/dotnet-runtime/THIRD-PARTY-NOTICES.TXT', 'licenses/nuget/PACKAGES.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDir $doc))) { throw "Missing $doc in the Windows publish output" }
          }
          $packageDir = Join-Path $env:RUNNER_TEMP 'packages-win-x64'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $zipName = "RealmPortal-$($env:PACKAGE_VERSION)-win-x64.zip"
          $zipPath = Join-Path $packageDir $zipName
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $packageDir 'SHA256SUMS'), "$hash  $zipName`n", [Text.Encoding]::ASCII)
          "PACKAGE_DIR=$packageDir" >> $env:GITHUB_ENV

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realm-portal-win-x64-${{ steps.version.outputs.version }}
          path: |
            ${{ env.PACKAGE_DIR }}/*.zip
            ${{ env.PACKAGE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # Tag-only: create a draft GitHub Release, upload packages + SHA256SUMS and verify them, then stop. The release is
  # signed and published by hand with packaging/sign-and-publish.sh (#116): the signing key never touches GitHub.
  # rc tags (vX.Y.Z-rc.N) are published with --prerelease --latest=false so /releases/latest
  # (and the in-app update check) never offers them unless a future opt-in is added.
  draft-release:
    name: draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages, windows-package]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      PACKAGE_VERSION: ${{ needs.linux-packages.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download Linux packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: realm-portal-linux-${{ env.PACKAGE_VERSION }}
          path: artifacts/linux

      - name: Download Windows package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: realm-portal-win-x64-${{ env.PACKAGE_VERSION }}
          path: artifacts/win

      - name: Assemble release directory
        id: assets
        run: |
          set -euo pipefail
          ver="$PACKAGE_VERSION"
          deb_ver="$(packaging/linux/semver-to-deb-version.sh "$ver")"
          mkdir -p artifacts/release
          # Linux
          cp -v "artifacts/linux/realm-portal_${deb_ver}_amd64.deb" artifacts/release/
          cp -v "artifacts/linux/RealmPortal-${ver}-x86_64.AppImage" artifacts/release/
          # Windows
          cp -v "artifacts/win/RealmPortal-${ver}-win-x64.zip" artifacts/release/
          # Merged SHA256SUMS (one line per binary; same layout as historical releases)
          (
            cd artifacts/release
            sha256sum \
              "realm-portal_${deb_ver}_amd64.deb" \
              "RealmPortal-${ver}-win-x64.zip" \
              "RealmPortal-${ver}-x86_64.AppImage" \
              > SHA256SUMS
          )
          # Confirm a "~" in the .deb name survives (GitHub must not rename it)
          if [[ "$deb_ver" == *"~"* ]]; then
            [[ -f "artifacts/release/realm-portal_${deb_ver}_amd64.deb" ]]
            echo "deb asset keeps tilde: realm-portal_${deb_ver}_amd64.deb"
          fi
          echo "deb_version=$deb_ver" >> "$GITHUB_OUTPUT"
          if [[ "$ver" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          ls -la artifacts/release

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.assets.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft -q .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release ${TAG} is already published; refusing to modify an immutable release"
              exit 1
            fi
            echo "Reusing existing draft release ${TAG}"
            # Drop previous assets so re-runs are idempotent. This also drops a SHA256SUMS.minisig from an earlier
            # signing run, which would not match the rebuilt SHA256SUMS anyway.
            mapfile -t names < <(gh release view "$TAG" --json assets -q '.assets[].name')
            for name in "${names[@]+"${names[@]}"}"; do
              [[ -n "$name" ]] || continue
              gh release delete-asset "$TAG" "$name" --yes
            done
            gh release edit "$TAG" --prerelease="$IS_PRERELEASE"
          else
            title="Realm Portal ${PACKAGE_VERSION}"
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --generate-notes \
              --prerelease="$IS_PRERELEASE" \
              --title "$title"
            echo "Created draft release ${TAG}"
          fi

      - name: Upload assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" artifacts/release/* --clobber

      - name: Verify assets, digests, sizes, and download URLs
        env:
          GH_TOKEN: ${{ github.token }}
          DEB_VERSION: ${{ steps.assets.outputs.deb_version }}
          IS_PRERELEASE: ${{ steps.assets.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          ver="$PACKAGE_VERSION"
          deb_ver="$DEB_VERSION"
          owner_repo="${GITHUB_REPOSITORY}"
          expected=(
            "realm-portal_${deb_ver}_amd64.deb"
            "RealmPortal-${ver}-x86_64.AppImage"
            "RealmPortal-${ver}-win-x64.zip"
            "SHA256SUMS"
          )
          mapfile -t remote < <(gh release view "$TAG" --json assets -q '.assets[].name' | sort)
          mapfile -t want < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${remote[*]}" != "${want[*]}" ]]; then
            echo "::error::Asset name mismatch. remote=(${remote[*]}) want=(${want[*]})"
            exit 1
          fi
          mapfile -t sums_names < <(awk '{print $2}' artifacts/release/SHA256SUMS | sort)
          mapfile -t bin_names < <(printf '%s\n' \
            "realm-portal_${deb_ver}_amd64.deb" \
            "RealmPortal-${ver}-x86_64.AppImage" \
            "RealmPortal-${ver}-win-x64.zip" | sort)
          if [[ "${sums_names[*]}" != "${bin_names[*]}" ]]; then
            echo "::error::SHA256SUMS entries mismatch"
            cat artifacts/release/SHA256SUMS
            exit 1
          fi
          # GET .../releases/tags/{tag} only returns published releases; drafts are
          # invisible there. List releases (auth includes drafts) and select by tag.
          release_json=""
          page=1
          while :; do
            page_json="$(gh api "repos/${owner_repo}/releases?per_page=100&page=${page}")"
            count="$(jq 'length' <<<"$page_json")"
            [[ "$count" -gt 0 ]] || break
            candidate="$(jq -c --arg t "$TAG" '
              .[] | select(.tag_name == $t and .draft == true)
            ' <<<"$page_json" | head -n 1)"
            if [[ -n "${candidate}" ]]; then
              release_json="${candidate}"
              break
            fi
            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done
          if [[ -z "${release_json}" ]]; then
            echo "::error::Draft release for tag ${TAG} not found via releases list"
            exit 1
          fi
          while read -r digest name; do
            [[ -n "$name" ]] || continue
            local_path="artifacts/release/${name}"
            local_digest="$(sha256sum "$local_path" | awk '{print $1}')"
            [[ "$local_digest" == "$digest" ]] || {
              echo "::error::Local digest drift for ${name}"
              exit 1
            }
            api_asset="$(jq -c --arg n "$name" '.assets[] | select(.name==$n)' <<<"$release_json")"
            [[ -n "$api_asset" ]] || {
              echo "::error::Missing API asset ${name}"
              exit 1
            }
            remote_digest="$(jq -r '.digest // empty' <<<"$api_asset")"
            [[ "$remote_digest" == "sha256:$digest" ]] || {
              echo "::error::Remote digest mismatch for ${name}: remote=${remote_digest} want=sha256:${digest}"
              exit 1
            }
            browser_url="$(jq -r '.browser_download_url' <<<"$api_asset")"
            remote_size="$(jq -r '.size' <<<"$api_asset")"
            local_size="$(stat -c%s "$local_path")"
            [[ "$remote_size" == "$local_size" ]] || {
              echo "::error::Size mismatch for ${name}: remote=${remote_size} local=${local_size}"
              exit 1
            }
            # Draft releases expose untagged-<id>/ download URLs until published.
            # Accept that shape here; final /download/${TAG}/ is asserted after publish.
            final_url="https://github.com/${owner_repo}/releases/download/${TAG}/${name}"
            untagged_prefix="https://github.com/${owner_repo}/releases/download/untagged-"
            untagged_suffix="/${name}"
            if [[ "$browser_url" == "$final_url" ]]; then
              :
            elif [[ "$browser_url" == "$untagged_prefix"*"$untagged_suffix" ]]; then
              mid="${browser_url#"$untagged_prefix"}"
              mid="${mid%"$untagged_suffix"}"
              if [[ -z "$mid" || "$mid" == */* || "$browser_url" != "${untagged_prefix}${mid}${untagged_suffix}" ]]; then
                echo "::error::browser_download_url mismatch for ${name}: got ${browser_url} (want ${final_url} or untagged-*/${name})"
                exit 1
              fi
              echo "ok (draft): ${name} still on untagged download URL"
            else
              echo "::error::browser_download_url mismatch for ${name}: got ${browser_url} (want ${final_url} or untagged-*/${name})"
              exit 1
            fi
            if [[ "$name" == *"~"* ]]; then
              [[ "$browser_url" == *"~"* ]] || {
                echo "::error::GitHub renamed tilde out of ${name}"
                exit 1
              }
            fi
            echo "ok: ${name} size=${local_size} url=${browser_url}"
          done < artifacts/release/SHA256SUMS
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == "$IS_PRERELEASE" ]] || {
            echo "::error::Draft prerelease flag does not match the tag (want ${IS_PRERELEASE})"
            exit 1
          }
          echo "ok: draft asset digests/sizes/names verified (sign-and-publish.sh checks the final URLs after publishing)"
      - name: Next step (manual signing and publishing)
        env:
          IS_PRERELEASE: ${{ steps.assets.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          {
            echo "### Draft ${TAG} is ready to sign"
            echo
            echo "CI stops at the draft. On the maintainer's machine, with the release key:"
            echo
            echo '```'
            echo "packaging/sign-and-publish.sh --key <path to minisign.key> ${TAG}"
            echo '```'
            echo
            echo "It signs SHA256SUMS, uploads SHA256SUMS.minisig, verifies it and publishes (prerelease: ${IS_PRERELEASE})."
            echo "See docs/linux-packaging.md."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Draft ${TAG} left unpublished; run packaging/sign-and-publish.sh to sign and publish it."
