name: Bug report
description: Something in Realm Portal does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Everything here is public: do not paste passwords, account names,
        or paths and logs with personal details you do not want published. Report security problems privately (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Realm Portal version
      description: Shown in the status bar, or by `realm-portal --version`.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS or distro and version, plus desktop environment on Linux.
      placeholder: "Ubuntu 24.04, GNOME on Wayland / Windows 11"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - .deb package
        - AppImage
        - Windows zip
        - Built from source
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Game client version
      description: If the bug involves a game client.
      placeholder: "3.3.5a (12340)"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error message if there is one. Screenshots help for UI problems.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or command output
      description: Optional. Remove personal paths and names before pasting.
      render: text
